name: Release admission
# Development PRs use version-policy.yml and package tests, without release history.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (for example 0.2.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-admission:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: hyperme-sh/spanopticon/.github/workflows/gateway-oci-successor.yml@91367f22ca9cba4acc5dc938192d57cadb2485a8
    with:
      release-line: '0.2'
      baseline-ref: 222e4a8fe278aea844a30b7ba0f79f80b6ff033c
      requested-version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '' }}
