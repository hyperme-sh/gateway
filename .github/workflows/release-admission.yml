name: Release admission
# Development PRs use version-policy.yml and package tests, without release history.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (for example 0.2.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-admission:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: hyperme-sh/spanopticon/.github/workflows/gateway-oci-successor.yml@8a78c1298a02163625a6dae98f5dce7fc742af40
    with:
      release-line: '0.2'
      baseline-ref: 156c766152c9bc162045c6459ad8a5e66f9889c3
      requested-version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '' }}
