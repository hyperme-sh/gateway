# Pull requests run unit/contract checks and package builds.
# The image archive stays on the runner. Nothing downloads prepared-dist,
# so this workflow does not upload it.
name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify source, wheel and rebuilt source archive
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/prepared-package.XXXXXX")
          export RELEASE_ARTIFACT_DIR="$output/dist"
          export PREPARATION_EVIDENCE_DIR="$output/evidence"
          echo "PREPARED_OUTPUT=$output" >> "$GITHUB_ENV"
          bash scripts/check-package.sh --fixtures
      - name: Build runtime and reject retained distribution layers
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/gateway-image-check.XXXXXX")
          image="gateway:layer-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          python3 scripts/prepare-runtime-context.py --artifacts "$PREPARED_OUTPUT/dist" \
            --output "$scratch/context" --source-sha "$GITHUB_SHA"
          docker build --build-arg "SOURCE_SHA=$GITHUB_SHA" -t "$image" "$scratch/context"
          python3 scripts/check_runtime_layers.py --image "$image"
