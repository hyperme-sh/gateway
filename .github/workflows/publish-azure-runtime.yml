name: Publish the protected Gateway runtime to Azure

on:
  workflow_dispatch:
    inputs:
      version:
        description: Authorized immutable Gateway release tag
        type: string
        required: true
      expected_digest:
        description: Exact authorized OCI manifest digest
        type: string
        required: true

permissions: {}
concurrency:
  group: gateway-azure-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hyperme-sh/gateway' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, debrunner]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_TAG: ${{ inputs.version }}
      EXPECTED_DIGEST: ${{ inputs.expected_digest }}
    steps:
      - name: Verify the immutable release and isolate local credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/gateway-azure-release.XXXXXXXX")
          printf 'PUBLISH_WORK=%s\nAZURE_CONFIG_DIR=%s/azure\nDOCKER_CONFIG=%s/docker\n' "$work" "$work" "$work" >> "$GITHUB_ENV"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG")
          attachment=$(jq -er --arg tag "$VERSION_TAG" '
            select(.tag_name == $tag and .immutable and (.draft | not) and (.prerelease | not)) |
            [.assets[] | select(.name == "runtime-provenance.json")] | select(length == 1) | .[0].digest
          ' <<< "$release")
          [[ "$attachment" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh release download "$VERSION_TAG" -R "$GITHUB_REPOSITORY" --pattern runtime-provenance.json --output "$work/provenance.json"
          printf '%s  %s\n' "${attachment#sha256:}" "$work/provenance.json" | sha256sum --check
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION_TAG" --jq '.sha')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg version "${VERSION_TAG#v}" --arg revision "$revision" --arg digest "$EXPECTED_DIGEST" '
            .schema_version == 1 and .repository == $repository and .version == $version and .revision == $revision
            and .artifact.kind == "container" and .artifact.sha256 == ($digest | sub("^sha256:"; ""))
            and .artifact.uri == ("ghcr.io/hyperme-sh/hypermesh-gateway/runtime@" + $digest)
          ' "$work/provenance.json" >/dev/null
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.GATEWAY_PROD_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mirror the qualified bytes and protect the ACR version
        shell: bash
        run: |
          set -euo pipefail
          registry=acrfybercg47
          server="$registry.azurecr.io"
          source=ghcr.io/hyperme-sh/hypermesh-gateway/runtime
          repository=hypermesh-gateway
          target="$server/$repository:$VERSION_TAG"
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          az acr login --name "$registry" --expose-token --query accessToken -o tsv |
            docker login "$server" --username 00000000-0000-0000-0000-000000000000 --password-stdin

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest
          }
          test "$(digest_of "$source:$VERSION_TAG")" = "$EXPECTED_DIGEST"
          if docker manifest inspect "$target" >/dev/null 2>"$PUBLISH_WORK/lookup.err"; then
            test "$(digest_of "$target")" = "$EXPECTED_DIGEST"
          elif [[ "$(cat "$PUBLISH_WORK/lookup.err")" == "no such manifest: $target" ||
                    "$(cat "$PUBLISH_WORK/lookup.err")" == 'manifest unknown' ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$target" "$source@$EXPECTED_DIGEST"
          else
            echo 'Cannot determine the destination tag state.' >&2
            exit 1
          fi
          test "$(digest_of "$target")" = "$EXPECTED_DIGEST"
          az acr repository update --name "$registry" --image "$repository:$VERSION_TAG" --write-enabled false --delete-enabled false -o none
          az acr repository update --name "$registry" --image "$repository@$EXPECTED_DIGEST" --delete-enabled false -o none
          az acr repository show --name "$registry" --image "$repository:$VERSION_TAG" |
            jq -e --arg digest "$EXPECTED_DIGEST" '.digest == $digest and
              .changeableAttributes.writeEnabled == false and .changeableAttributes.deleteEnabled == false' >/dev/null
          az acr repository show --name "$registry" --image "$repository@$EXPECTED_DIGEST" |
            jq -e --arg digest "$EXPECTED_DIGEST" '.digest == $digest and .changeableAttributes.deleteEnabled == false' >/dev/null
          printf 'Protected %s at %s\n' "$target" "$EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove job-local registry credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${PUBLISH_WORK:-}" ]]; then rm -rf -- "$PUBLISH_WORK"; fi
